<div #heroWrap class="bol-hero-wrap">
  <div #heroStage class="bol-hero-stage">
    <div #photoBox class="bol-hero-photobox">
      <img #heroPhoto src="assets/cr-photo-reg.png" alt="Croissant recién horneado" class="bol-hero-img bol-hero-img--photo" />
      <img #heroIllus src="assets/cr-illus-reg.png" alt="Croissant ilustrado" class="bol-hero-img bol-hero-img--illus" />
      <img #heroLogo src="assets/logo-clean.png" alt="Bollería Panadería" class="bol-hero-img bol-hero-img--logo" />
      <div #introCap class="bol-hero-introcap">
        <div class="bol-hero-introcap__inner">
          <div class="bol-hero-introcap__glow" aria-hidden="true"></div>
          <span class="bol-hero-introcap__text">Todo empieza antes del primer bocado.</span>
        </div>
      </div>
    </div>
    <canvas #heroCanvas aria-hidden="true" class="bol-hero-canvas"></canvas>
    <div #heroCaption class="bol-hero-caption">
      <span #captionEyebrow class="bol-hero-caption__eyebrow"></span>
      <span #captionText class="bol-hero-caption__text"></span>
      <span #captionUnderline class="bol-hero-caption__underline"></span>
    </div>
    <div #scrollHint class="bol-hero-hint">
      <span>Deslizá para descubrir</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc,#C8912A)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </div>
  </div>
</div>
