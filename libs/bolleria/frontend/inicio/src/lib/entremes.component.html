<!-- La foto es un background-image con background-attachment:fixed: mientras
     la sección (200vh) cruza la ventana, se ve "fija" respecto a la pantalla.
     El texto vive DENTRO de esa misma sección, con position:sticky, así queda
     pegado a la imagen ese mismo tramo de scroll — sin JavaScript, sin fade,
     sin mostrar/ocultar: el resto de la página lo cubre de forma natural al
     seguir bajando, igual que a la propia imagen. -->
<section class="bol-entremes">
  <div class="bol-entremes__sticky">
    <div class="bol-entremes__copy">
      <p class="bol-entremes__line1">
        Hay lugares a los que se entra… y lugares a los que se quiere volver.
      </p>
      <p class="bol-entremes__line2">Ven a descubrir el nuestro.</p>
    </div>
  </div>
</section>
