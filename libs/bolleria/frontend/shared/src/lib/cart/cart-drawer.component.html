<div class="bol-cart-backdrop" [class.bol-cart-backdrop--open]="cartOpen()" (click)="closeCart()"></div>
<aside class="bol-cart-drawer" [class.bol-cart-drawer--open]="cartOpen()">
  <div class="bol-cart-drawer__head">
    <div class="bol-cart-drawer__title">Tu pedido</div>
    <button type="button" (click)="closeCart()" aria-label="Cerrar" class="bol-cart-drawer__close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="bol-cart-drawer__body">
    @if (cartEmpty()) {
      <div class="bol-cart-drawer__empty">
        <img src="assets/mark.png" alt="" />
        <p>Tu pedido está vacío.<br />Agregá productos desde el menú.</p>
        <a href="#" (click)="$event.preventDefault(); goMenuFromCart()">Ver menú</a>
      </div>
    }
    @if (cartHas()) {
      @for (l of cartLines(); track l.id) {
        <div class="bol-cart-drawer__line">
          <div class="bol-cart-drawer__line-info">
            <div class="bol-cart-drawer__line-name">{{ l.item.name }}</div>
            <div class="bol-cart-drawer__line-price">{{ fmt(l.item.price) }} c/u</div>
          </div>
          <div class="bol-cart-drawer__qty">
            <button type="button" (click)="dec(l.id)" aria-label="Quitar uno">−</button>
            <span>{{ l.qty }}</span>
            <button type="button" (click)="inc(l.id)" aria-label="Agregar uno">+</button>
          </div>
        </div>
      }
    }
  </div>

  @if (cartHas()) {
    <div class="bol-cart-drawer__footer">
      <div class="bol-cart-drawer__total">
        <span>Total</span>
        <span>{{ cartTotalFmt() }}</span>
      </div>
      <a [href]="waCheckout()" target="_blank" rel="noopener" class="bol-cart-drawer__checkout">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm4.5 12.2c-.2-.1-1.4-.7-1.7-.8s-.4-.1-.5.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.6-1.2a.5.5 0 0 0 0-.5c0-.1-.5-1.3-.7-1.7s-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11 11 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.5 2.5 0 0 0 1.6-1.2 2 2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>
        Pedir por WhatsApp
        <span class="bol-cart-drawer__badge">Envío Express</span>
      </a>
      <button type="button" (click)="clear()" class="bol-cart-drawer__clear">Vaciar pedido</button>
    </div>
  }
</aside>
