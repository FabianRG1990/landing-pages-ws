<footer class="bol-footer">
  <div class="bol-footer__grid">
    <div>
      <img src="assets/logo-white.png" alt="Bollería Panadería" class="bol-footer__logo" />
      <p class="bol-footer__blurb">Pan artesanal, bollería francesa y masa madre horneados cada mañana en San José. Servicio express.</p>
    </div>
    <div>
      <div class="bol-footer__heading">Navegación</div>
      <div class="bol-footer__links">
        <a href="#" (click)="$event.preventDefault(); go('inicio')">Inicio</a>
        <a href="#" (click)="$event.preventDefault(); go('menu')">Menú</a>
        <a href="#" (click)="$event.preventDefault(); go('contacto')">Contacto</a>
      </div>
    </div>
    <div>
      <div class="bol-footer__heading">Contacto</div>
      <div class="bol-footer__info">
        <span style="font-variant-numeric: lining-nums tabular-nums">{{ contact.waDisplay }}</span>
        <span>{{ contact.correo }}</span>
        <span>{{ contact.horario }}</span>
      </div>
    </div>
  </div>
  <div class="bol-footer__bottom">© 2026 Bollería Panadería · San José, Costa Rica · Datos de contacto por confirmar</div>
</footer>
