<div class="bol-preloader" [class.bol-preloader--done]="loaded()" data-om-raster>
  <div class="bol-preloader__bg" aria-hidden="true"></div>
  <div class="bol-preloader__inner">
    <div class="bol-preloader__mark">
      <img src="assets/layer-bolleria.png" alt="Bollería" class="bol-preloader__layer bol-preloader__layer--bolleria" />
      <img src="assets/layer-panaderia.png" alt="Panadería" class="bol-preloader__layer bol-preloader__layer--panaderia" />
      <img src="assets/layer-b.png" alt="" class="bol-preloader__layer bol-preloader__layer--b" />
      <img src="assets/cr-detail-gold.png" alt="" class="bol-preloader__layer bol-preloader__layer--gold" />
      <img src="assets/cr-detail-green.png" alt="" class="bol-preloader__layer bol-preloader__layer--green" />
      <img src="assets/layer-croissant.png" alt="Croissant" class="bol-preloader__layer bol-preloader__layer--croissant" />
    </div>
    <div class="bol-preloader__track">
      <div class="bol-preloader__bar"></div>
    </div>
  </div>
</div>
