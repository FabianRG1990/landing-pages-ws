<!-- Cortina cinematográfica entre segmentos — transcripción fiel del original -->
<div [attr.style]="transStyle()">
  @if (navigating()) {
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
      <div style="position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.06) 45%,rgba(255,90,98,.14) 52%,transparent 62%);transform:skewX(-14deg);animation:amv-trsweep .9s cubic-bezier(.4,0,.2,1) .25s both"></div>
      <div [attr.style]="glowStyle()"></div>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
      <img src="assets/automotivo-logo-trim.png" alt="" [attr.style]="trLogoStyle()">
      <div [attr.style]="trLineStyle()"></div>
      <div [attr.style]="trLabelStyle()">{{ label() }}</div>
    </div>
  }
</div>
