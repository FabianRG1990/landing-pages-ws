<!-- NAVBAR (barra swoosh anclada arriba-centro) — transcripción fiel del original -->
<header [attr.style]="navStyle">
  <button (click)="goHome()" [attr.style]="navLogoStyle()"><img src="assets/automotivo-logo-trim.png" alt="Automotivo" style="height:40px;width:auto;filter:drop-shadow(0 3px 14px rgba(0,0,0,.6))"></button>

  <div class="amv-nav-wrap" [attr.style]="navWrapStyle">
    <div class="amv-desk amv-navbar" [attr.style]="navBarStyle()">
      <svg width="70" height="58" viewBox="0 0 70 58" preserveAspectRatio="none" style="display:block;margin-right:-1px;filter:drop-shadow(0 14px 34px rgba(0,0,0,.4))"><path d="M0 0 L70 0 L70 58 L22 58 C10 58 8 3 0 0 Z" fill="rgba(18,19,23,.82)"></path></svg>
      <div class="amv-navbody" style="display:flex;align-items:stretch;height:58px;padding-right:4px;position:relative">
        <nav style="display:flex;align-items:stretch;gap:1px">
          <button (click)="go('inicio')" class="amv-navlink" [attr.style]="linkBase(screen()==='inicio')">Inicio<span [attr.style]="indStyle(screen()==='inicio')"></span></button>
          <button (click)="go('servicios')" class="amv-navlink" [attr.style]="linkBase(screen()==='servicios')">Servicios<span [attr.style]="indStyle(screen()==='servicios')"></span></button>
          @for (n of navItems2; track n.id) {
            <button (click)="go(n.id)" class="amv-navlink" [attr.style]="linkBase(screen()===n.id)">{{ n.label }}<span [attr.style]="indStyle(screen()===n.id)"></span></button>
          }
        </nav>
        <div style="width:1px;background:rgba(255,255,255,.12);margin:18px 12px"></div>
        <button (click)="go('contacto')" class="amv-navlink" style="display:flex;align-items:center;gap:8px;padding:0 6px;white-space:nowrap;color:#F2F3F5;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;transition:color .25s">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E11D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
          Agendar cita
        </button>
      </div>
      <svg width="70" height="58" viewBox="0 0 70 58" preserveAspectRatio="none" style="display:block;margin-left:-1px;filter:drop-shadow(0 14px 34px rgba(0,0,0,.4))"><path d="M70 0 L0 0 L0 58 L48 58 C60 58 62 3 70 0 Z" fill="rgba(18,19,23,.82)"></path></svg>
    </div>

    <button (click)="toggleNavOpen($event)" class="amv-desk amv-nav-tab" [attr.style]="navTabStyle()" aria-label="Mostrar menú">
      <span style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 22px 7px;background:rgba(18,19,23,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-top:none;border-radius:0 0 15px 15px;box-shadow:0 12px 26px rgba(0,0,0,.4)">
        <span style="display:block;width:20px;height:2px;border-radius:2px;background:rgba(238,240,243,.85)"></span>
        <span style="display:block;width:20px;height:2px;border-radius:2px;background:rgba(238,240,243,.55)"></span>
        <span style="display:block;width:12px;height:2px;border-radius:2px;background:#E11D2E;margin-top:1px"></span>
      </span>
    </button>
  </div>

  <button (click)="toggleMenu()" class="amv-burg" style="position:absolute;right:clamp(20px,4vw,40px);top:18px;flex-direction:column;gap:5px;padding:11px 12px;pointer-events:auto;background:rgba(18,19,23,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:12px" aria-label="Menú">
    <span style="display:block;width:22px;height:1.7px;background:#F2F3F5"></span><span style="display:block;width:22px;height:1.7px;background:#F2F3F5"></span><span style="display:block;width:22px;height:1.7px;background:#F2F3F5"></span>
  </button>
</header>

<!-- MOBILE MENU -->
<div [attr.style]="mobileStyle()">
  <div style="width:100%;max-width:480px">
    @for (m of mobileItems; track m.id) {
      <button (click)="go(m.id)" style="display:flex;align-items:baseline;gap:16px;width:100%;padding:16px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#E11D2E">{{ m.num }}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:600;text-transform:uppercase;font-size:clamp(30px,8vw,46px)" [style.color]="screen()===m.id ? '#E11D2E' : '#F2F3F5'">{{ m.label }}</span>
      </button>
    }
  </div>
</div>
