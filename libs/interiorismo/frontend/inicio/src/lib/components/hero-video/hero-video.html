<section class="hero" [class.hero-in]="intro()">
  <video
    #video
    class="hero-video"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    poster="/hero-poster.jpg"
  >
    <source src="/hero.mp4" type="video/mp4" />
  </video>

  <div class="hero-halo"></div>
  <div class="hero-vignette"></div>
  <div class="hero-fade-top"></div>
  <div class="hero-fade-bottom"></div>

  <div class="hero-content">
    <div class="hero-inner">
      <span class="hero-badge">Estudio de Interiorismo</span>
      <h1>Espacios pensados<br />desde la luz<br />y la materia</h1>
      <p class="hero-sub">
        Diseñamos residencias que envejecen en silencio. Cada proyecto comienza
        con una conversación larga sobre cómo se quiere vivir en casa.
      </p>
      <div class="hero-cta">
        <a class="btn btn-primary btn-lg" appMagnetic routerLink="/proyectos">
          <span>Ver proyectos</span>
          <span class="btn-ico" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7v10" /></svg>
          </span>
        </a>
      </div>
    </div>
  </div>
</section>
