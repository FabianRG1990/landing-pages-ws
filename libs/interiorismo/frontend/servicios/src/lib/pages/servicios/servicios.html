<div class="page">
  <section class="wrap section services">
    <span class="eyebrow" appReveal>Especialidades</span>
    <h2 class="h-section" appReveal>
      Una aproximación deliberada a cada detalle
    </h2>

    <div class="services-list">
      @for (s of services; track s.num) {
        <div class="service-row" appReveal>
          <div class="service-grid">
            <p class="service-num">{{ s.num }}</p>
            <div class="service-title">
              <h3>{{ s.title }}</h3>
            </div>
            <div class="service-desc">
              <p>{{ s.body }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </section>
</div>
