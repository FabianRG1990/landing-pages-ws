<header id="nav" [class.scrolled]="scrolled()">
  <div class="nav-inner">
    <a class="brand" routerLink="/inicio">Atelier Solano</a>

    <nav class="nav-links">
      @for (item of items; track item.id) {
        <a [routerLink]="'/' + item.id" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>

    <a class="btn btn-primary nav-cta" routerLink="/contacto">
      <span>Agendar consulta</span>
      <span class="btn-ico" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7v10" /></svg>
      </span>
    </a>

    <button
      class="nav-burger"
      [class.open]="menuOpen()"
      type="button"
      aria-label="Menú"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div id="mobile-menu" [class.open]="menuOpen()">
  <nav>
    @for (item of items; track item.id) {
      <a class="menu-link" [routerLink]="'/' + item.id" (click)="closeMenu()">
        <span class="mnum">{{ item.num }}</span>{{ item.label }}
      </a>
    }
  </nav>
</div>
