@if (!gone()) {
  <div id="app-preloader" [class.is-hidden]="hidden()" aria-hidden="true">
    <div class="pl-stage">
      <!-- Anillos de pulso que emanan -->
      <span class="pl-pulse"></span>
      <span class="pl-pulse pl-pulse--2"></span>

      <!-- Tacómetro + marca -->
      <div class="pl-gauge-wrap">
        <svg class="pl-gauge" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="plGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#C5A028" />
              <stop offset="0.5" stop-color="#F7E08A" />
              <stop offset="1" stop-color="#C5A028" />
            </linearGradient>
            <filter id="plGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.4" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Marcas tipo velocímetro (anillo punteado) -->
          <circle class="pl-ticks" cx="100" cy="100" r="92" />
          <!-- Pista tenue -->
          <circle class="pl-track" cx="100" cy="100" r="80" />
          <!-- Arco dorado que revoluciona -->
          <circle class="pl-sweep" cx="100" cy="100" r="80" />
        </svg>

        <div class="pl-brand">VELOX</div>
      </div>

      <!-- Narrativa de carga (sin números) -->
      <div class="pl-words">
        <span>Igniting the experience</span>
        <span>Calibrating the machine</span>
        <span>Unveiling the VELOX</span>
      </div>
    </div>
  </div>
}
