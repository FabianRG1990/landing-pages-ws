<nav class="nav" [class.nav--scrolled]="scrolled()">
  <div class="nav-inner">
    <a appLink="/" class="nav-brand gold-text">VELOX</a>

    <div class="nav-links">
      @for (link of links; track link.label) {
        <a
          [appLink]="link.target"
          class="nav-link"
          [class.nav-link--active]="isActive(link.target)"
          >{{ link.label }}</a
        >
      }
    </div>

    <div class="nav-actions">
      <a href="#" class="nav-signin">Sign In</a>
      <a appLink="/ownership" class="btn-gold nav-cta">Unlock Test Drive</a>
    </div>

    <button
      type="button"
      class="nav-burger"
      [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="open()"
      (click)="toggle()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        @if (open()) {
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        } @else {
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        }
      </svg>
    </button>
  </div>

  @if (open()) {
    <div class="nav-mobile">
      @for (link of links; track link.label) {
        <a
          [appLink]="link.target"
          class="nav-mobile-link"
          [class.nav-mobile-link--active]="isActive(link.target)"
          (click)="close()"
          (keydown.enter)="close()"
          tabindex="0"
          >{{ link.label }}</a
        >
      }
      <a appLink="/ownership" class="btn-gold nav-mobile-cta" (click)="close()" (keydown.enter)="close()" tabindex="0">
        Unlock Your Test Drive
      </a>
    </div>
  }
</nav>
