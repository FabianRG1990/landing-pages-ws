<div id="showcase-track" #track>
  <div id="showcase-sticky">
    <!-- Video oculto — único propósito: extracción de frames -->
    <video
      #video
      [src]="videoSrc"
      preload="auto"
      playsinline
      muted
      style="display: none"
      (canplaythrough)="onCanPlayThrough()"
    ></video>

    <!-- Canvas de frames — bg transparente (sin fillRect) -->
    <canvas #canvas id="frame-canvas"></canvas>

    <!-- Glow cálido cobre -->
    <div id="canvas-glow"></div>

    <!-- Overlay de carga / extracción -->
    <div id="video-loading" #loading>
      <div class="vl-inner">
        <div class="loader-ring"></div>
        <div class="vl-text">
          <div class="gold-text vl-title">Rendering Experience</div>
          <div class="vl-msg">{{ loadMsg() }}</div>
          <div class="vl-count">{{ progressText() }}</div>
          <div class="extract-bar-wrap">
            <div class="extract-bar-fill" #fill style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Viñeta + fade inferior (::after del sticky) -->
    <div id="video-overlay"></div>
    <div id="scroll-progress-bar" #bar></div>

    <!-- Etiqueta central — visible a mitad de scroll -->
    <div id="showcase-label" #label style="opacity: 0">
      <div class="sl-eyebrow">Exhibition Mode</div>
      <div class="sl-title">
        The Lamborghini<br /><span class="gold-text">Urus Noir</span>
      </div>
      <div class="sl-sub">Keep scrolling to release it</div>
    </div>

    <!-- Hint de scroll -->
    <div id="scroll-hint" #hint>
      <span>Scroll to reveal</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#C5A028" stroke-width="1.5" stroke-linecap="round">
        <path d="M12 5v14M5 12l7 7 7-7" />
      </svg>
    </div>

    <!-- Contador de frame sutil -->
    <div class="frame-badge" #frameBadge></div>
  </div>
</div>
