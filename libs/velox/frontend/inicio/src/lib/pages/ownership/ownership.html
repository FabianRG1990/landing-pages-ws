<section class="page page--ownership" id="ownership">
  <div class="cta-glow"></div>

  <header class="page-head wrap">
    <span class="eyebrow" appReveal>Ownership</span>
    <h1 class="page-h1" appReveal>
      Reserve your moment<br /><span class="gold-text">behind the wheel.</span>
    </h1>
    <p class="page-lead" appReveal>
      Test drives are by appointment only. Experience 850 horsepower of
      hand-crafted luxury — on your terms, at your pace.
    </p>
    <div class="page-cta" appReveal>
      <button type="button" class="btn-gold">Unlock Your Test Drive</button>
    </div>
    <p class="page-note" appReveal>
      No commitment required. A specialist will be in touch within 24 hours.
    </p>
  </header>

  <figure class="quote-inner wrap" appReveal>
    <svg class="quote-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5 7H6a3 3 0 0 0-3 3v7h7v-7H6.5a1 1 0 0 1 1-1h2zM21 7h-3.5a3 3 0 0 0-3 3v7h7v-7H18a1 1 0 0 1 1-1h2z"/></svg>
    <blockquote class="quote-text">{{ testimonial.quote }}</blockquote>
    <figcaption class="quote-by">
      <span class="quote-author gold-text">{{ testimonial.author }}</span>
      <span class="quote-role">{{ testimonial.role }}</span>
    </figcaption>
  </figure>
</section>
