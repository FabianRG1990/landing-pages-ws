<section class="screen" id="inicio">
  <div class="hero">
    <div class="hero__copy">
      <div class="eyebrow" appReveal><span class="eyebrow__line"></span><span>{{ t().hero.eyebrow }}</span></div>
      <h1 class="hero__title" appReveal>{{ t().hero.title }}</h1>
      <p class="hero__sub" appReveal>{{ t().hero.sub }}</p>
      <div class="hero__actions" appReveal>
        <a class="btn btn--wa" [href]="waHref()" target="_blank" rel="noopener">
          <svg class="ico-wa" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.13a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.39c0-4.54 3.7-8.23 8.24-8.23a8.2 8.2 0 0 1 8.23 8.24c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.42-.14-.01-.31-.01-.48-.01-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>
          <span>{{ t().hero.primary }}</span>
        </a>
        <a class="btn btn--ghost" routerLink="/sobre">
          <span>{{ t().hero.secondary }}</span>
          <svg class="ico-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div class="hero__cred" appReveal>
        <img src="assets/logo-mark.png" alt="" />
        <span>{{ t().hero.cred }}</span>
      </div>
    </div>

    <div class="hero__media" appReveal>
      <div class="portrait portrait--arch">
        <div class="portrait__outline"></div>
        <div class="portrait__inner">
          <span class="portrait__icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.6"/><path d="M5.5 19.5a6.6 6.6 0 0 1 13 0"/></svg>
          </span>
          <div class="portrait__title">{{ t().hero.frameTitle }}</div>
          <div class="portrait__hint">{{ t().hero.frameHint }}</div>
        </div>
        <div class="portrait__badge">
          <img src="assets/logo-mark.png" alt="" />
          <span>{{ t().hero.badge }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="marquee">
    <div class="marquee__track">
      @for (c of chips(); track $index) {
        <span class="chip" [class.chip--sage]="$index % 2 === 1">{{ c }}</span>
      }
    </div>
  </div>
</section>
