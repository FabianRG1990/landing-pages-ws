<section class="bol-book" data-nav-tono="papel">
  <!-- El libro ya no tiene botones: se recorre con el scroll.
       El scroll NO se intercepta en ningún momento —a diferencia del hero, que
       sí tiene controlador de paradas—. Esta pista solo aporta RECORRIDO: el
       componente lee en qué punto de ella está la ventana y deriva de ahí la
       página, llamando a los mismos open()/next()/prev() de siempre.

       Cinco piezas, y las que se leen miden lo que dicen para que el componente no
       tenga que repetir ninguna constante del SCSS:
         · __pin      la escena anclada, una pantalla de alto;
         · __recorrido  el scroll que se reparte entre las ocho vueltas;
         · __remate   la permanencia en la página de cierre, para que sus
                      botones de ubicación y mensaje no se escapen antes de poder pulsarlos;
         · __cierre   seguir bajando cierra la tapa sobre la última página;
         · __portada  el libro cerrado se queda un momento antes del footer. -->
  <div class="bol-book__track" #track>
    <div class="bol-book__pin">
      <!-- La cabecera ya no se ve: el libro se queda solo en pantalla y ocupa
           el sitio que ocupaban el rotulo, el titulo y la linea de ayuda. El
           titulo SIGUE AQUI, invisible pero leido por buscadores y lectores de
           pantalla: sin el, esta seccion se quedaria sin nombre y el documento
           sin su encabezado de nivel 2. -->
      <h2 class="bol-book__sr">Nuestra historia, página a página</h2>

      <!-- Envoltorio del escenario. Existe por una razon concreta: el escenario
           lleva margenes negativos arriba y abajo -se pega a la cabecera y se
           come el aire transparente que el video deja bajo el libro- y sin un
           contexto de formato propio esos margenes se colapsan hacia fuera y el
           centrado del pin cuenta mal. Ver `.bol-book__escena` en el SCSS. -->
      <div class="bol-book__escena">
        <div
          class="bol-book__stage"
          tabindex="0"
          role="group"
          aria-roledescription="libro"
          [attr.aria-label]="etiqueta()"
          aria-describedby="bol-book-ayuda"
          (keydown)="alTeclado($event)"
          (touchstart)="alEmpezarToque($event)"
          (touchend)="alSoltarToque($event)"
          (touchcancel)="alCancelarToque()"
        >
          <canvas #canvas class="bol-book__canvas" [class.is-ready]="ready()" [class.is-lifting]="lifting()"></canvas>
          <!-- TODO se dibuja sobre el canvas -fotos, texto y los propios botones de
               ubicación y mensaje, que son tinta de la página de cierre (ver drawSocialButton)-.
               Estos dos <a> son solo el área que se puede pulsar: van vacíos y sin
               pintar nada, colocados justo encima del cajetín dibujado con las
               medidas que da socialLinkStyle. El puntero encima marca el cajetín
               repintando la hoja, porque un bitmap no responde al hover por sí solo. -->
          @if (showSocialLinks()) {
            <a
              [href]="contact.mapsUrl"
              target="_blank"
              rel="noopener"
              class="bol-book__social-hit"
              [ngStyle]="socialLinkStyle('ubicacion')"
              aria-label="Ver la ubicación en Google Maps"
              (mouseenter)="marcaSocial('ubicacion')"
              (mouseleave)="marcaSocial(null)"
              (focus)="marcaSocial('ubicacion')"
              (blur)="marcaSocial(null)"
            ></a>
            <a
              [href]="mensajeUrl"
              target="_blank"
              rel="noopener"
              class="bol-book__social-hit"
              [ngStyle]="socialLinkStyle('mensaje')"
              aria-label="Enviar un mensaje por WhatsApp"
              (mouseenter)="marcaSocial('mensaje')"
              (mouseleave)="marcaSocial(null)"
              (focus)="marcaSocial('mensaje')"
              (blur)="marcaSocial(null)"
            ></a>
          }
        </div>
      </div>

      <!-- Invitación a girar el teléfono.
           Solo se ve en un teléfono DE PIE y con dedo (ver el SCSS): acostado ya
           se está viendo el libro nuevo, que es justo lo que esto promete, y en
           un escritorio no hay nada que girar. Se retira sola en cuanto la
           persona pasa de la primera página: para entonces ya decidió, y dejarla
           puesta sería insistir. `aria-hidden` porque no es una instrucción de
           manejo -el libro se recorre igual sin girar nada- sino una sugerencia
           visual; lo que sí se anuncia es la línea de ayuda de aquí abajo. -->
      @if (sugiereGirar()) {
        <p class="bol-book__girar" aria-hidden="true">
          <span class="bol-book__girar-icono"></span>
          <span class="bol-book__girar-texto">Girá el teléfono<em>y vas a verlo en grande</em></span>
        </p>
      }

      <!-- Sin nada a la vista: quitar los botones deja sin manejo a quien no
           puede usar el scroll con precisión. Estos controles no se ven pero sí
           se enfocan y los anuncia un lector de pantalla; no llaman a next()
           directamente sino que MUEVEN EL SCROLL a la página pedida, para que
           la posición de la ventana siga siendo la única fuente de verdad. -->
      <p id="bol-book-ayuda" class="bol-book__sr">
        Ocho páginas. Se pasan bajando y subiendo con el scroll, deslizando el dedo hacia los lados, o con las
        flechas del teclado.
      </p>
      <div class="bol-book__sr">
        <button type="button" (click)="irAIndice(estado() - 1)" [disabled]="estado() <= 0">Página anterior</button>
        <button type="button" (click)="irAIndice(estado() + 1)" [disabled]="estado() >= cerradoFinal">Página siguiente</button>
      </div>
    </div>

    <!-- Las ocho vueltas, una por pieza. Existen para poner un TOPE de scroll
         en cada hoja: sin ellas el recorrido es un solo bloque de 3.492 px y un
         deslizamiento con inercia lo atraviesa entero. Ver `.bol-book__paso` en
         el SCSS y `freno-de-pista.ts`.

         El recorrido sigue midiendo lo mismo -ocho veces la vuelta-, asi que
         `progresoPista` no se entera de que ahora tiene hijos. -->
    <div class="bol-book__recorrido" #recorrido>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
      <div class="bol-book__paso"></div>
    </div>
    <div class="bol-book__remate" #remate></div>
    <div class="bol-book__cierre" #cierre></div>
    <div class="bol-book__portada"></div>
  </div>
</section>
