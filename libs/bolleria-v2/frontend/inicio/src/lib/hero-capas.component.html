<!-- Una pantalla y nada más: los tres estados no se recorren, se saltan. El
     scroll solo dispara el paso; la transicion la cronometra el CSS. -->
<section class="bol-heroc">
  <div class="bol-heroc__fijo">
    <div class="bol-heroc__escena" aria-hidden="true">
      <!-- Los tres estados del mostrador. El primero va siempre debajo y opaco:
           así nunca hay un hueco, pase lo que pase con los otros dos. Fuera del
           mostrador los tres son el mismo píxel, de modo que el fundido sólo se
           ve donde hay pan. -->
      <img
        class="bol-heroc__muro"
        src="assets/hero-capas/hero-fondo-1.webp"
        alt=""
        decoding="async"
        fetchpriority="high"
      />
      <img
        class="bol-heroc__muro bol-heroc__muro--2"
        src="assets/hero-capas/hero-fondo-2.webp"
        alt=""
        decoding="async"
        fetchpriority="low"
      />
      <img
        class="bol-heroc__muro bol-heroc__muro--3"
        src="assets/hero-capas/hero-fondo-3.webp"
        alt=""
        decoding="async"
        fetchpriority="low"
      />
      <!-- El logo pintado en la pared, en su propia capa y COMÚN a los tres
           estados: entre el primer render y el tercero se corre 18 px, y en un
           fundido eso se vería deslizarse. En vertical el recorte lo deja justo
           debajo del titular y se leen dos textos encima del otro, así que ahí
           se retira: la marca ya está en el nav. -->
      <img class="bol-heroc__logo" src="assets/hero-capas/hero-logo.webp" alt="" decoding="async" />
      <!-- El olivo del primer plano: parte de la imagen, no una animación. -->
      @for (c of capas; track c.src) {
        <img class="bol-heroc__capa" [src]="c.src" alt="" decoding="async" />
      }
      <span class="bol-heroc__velo"></span>
    </div>

    <div class="bol-heroc__contenido">
      <!-- Los tres relevos ocupan la MISMA celda de la rejilla: el bloque mide
           siempre lo que el más alto y nada se mueve al cambiar de texto. -->
      <div class="bol-heroc__textos">
        @for (e of estados; track e.titulo; let i = $index) {
          <!-- La opacidad la pone el SCSS por posición, no una atadura: así, sin
               JavaScript -o con «menos movimiento»- el primero se ve y los otros
               dos no, sin depender de que nadie escriba nada. -->
          <div class="bol-heroc__texto">
            <!-- El rótulo de sitio va sólo en el primero. Vacío no se pinta:
                 un párrafo en blanco dejaría su hueco y el bloque de la
                 segunda parada quedaría descolgado respecto al de la primera. -->
            @if (e.lugar) {
              <p class="bol-heroc__lugar">{{ e.lugar }}</p>
            }
            @if (i === 0) {
              <h1 class="bol-heroc__titulo">{{ e.titulo }}<em>{{ e.enfasis }}</em></h1>
            } @else {
              <p class="bol-heroc__titulo">{{ e.titulo }}<em>{{ e.enfasis }}</em></p>
            }
            <p class="bol-heroc__bajada">{{ e.bajada }}</p>
          </div>
        }
      </div>

      <!-- Dos juegos de botones apilados en la misma celda, igual que los
           textos: el bloque mide siempre lo que el más alto y nada salta al
           relevarse. En la última parada la escena ya está vacía, así que las
           dos píldoras dejan sitio a una sola que lleva a la carta. -->
      <div class="bol-heroc__acciones">
        <div class="bol-heroc__grupo">
          <a href="#" (click)="$event.preventDefault(); irAlMenu()" class="bol-heroc__cta">
            Ver la carta
          </a>
          <a
            [href]="waDirect"
            target="_blank"
            rel="noopener"
            class="bol-heroc__cta bol-heroc__cta--sec"
          >
            Pedir por WhatsApp
          </a>
        </div>
        <div class="bol-heroc__grupo">
          <a href="#" (click)="$event.preventDefault(); irAlMenu()" class="bol-heroc__cta">
            Ver nuestro menú
          </a>
        </div>
      </div>
    </div>

    <span class="bol-heroc__pista" aria-hidden="true">
      <span>Seguí bajando</span>
      <i></i>
    </span>
  </div>
</section>
