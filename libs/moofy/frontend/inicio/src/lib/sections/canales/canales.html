<section id="canales" class="canales" aria-labelledby="canales-titulo">
  <div class="shell">
    <header class="canales__cabeza">
      <app-capitulo [num]="c.num" [nombre]="c.nombre" appRevelar />
      <h2 id="canales-titulo" class="titular" appRevelar [retraso]="80">
        <app-renglones [renglones]="c.titulo" />
      </h2>
      <p class="lead" appRevelar [retraso]="220">{{ c.entrada }}</p>
    </header>

    <div class="canales__cuerpo" appRevelar [retraso]="120">
      <div class="canales__pestanas" role="tablist" aria-label="Canales">
        @for (canal of c.items; track canal.id; let i = $index) {
          <button
            #pestana
            type="button"
            role="tab"
            class="pestana"
            [id]="'canal-' + canal.id"
            [attr.aria-selected]="i === indice()"
            [attr.aria-controls]="'panel-canales'"
            [attr.tabindex]="i === indice() ? 0 : -1"
            (click)="elegir(i)"
            (keydown)="teclado($event)"
          >
            <span class="pestana__num mono">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <span class="pestana__nombre">{{ canal.nombre }}</span>
          </button>
        }
      </div>

      <div
        id="panel-canales"
        class="panel"
        role="tabpanel"
        tabindex="0"
        [attr.aria-labelledby]="'canal-' + activo().id"
      >
        <div class="panel__foto">
          @for (img of imagenes; track img.src) {
            <img
              [src]="img.src"
              alt=""
              width="1536"
              height="1024"
              loading="lazy"
              decoding="async"
              [class.visible]="img.src === activo().imagen"
            />
          }
          <span class="solo-lectores">{{ activo().alt }}</span>
        </div>

        @for (a of [activo()]; track a.id) {
          <div class="panel__info carta">
            <p class="panel__frase">{{ a.frase }}</p>
            <dl class="panel__datos">
              @for (d of a.datos; track d.k) {
                <div>
                  <dt class="mono">{{ d.k }}</dt>
                  <dd>{{ d.v }}</dd>
                </div>
              }
            </dl>
            <a class="btn btn--rojo panel__cta" [href]="whatsapp()" target="_blank" rel="noopener">
              <app-icono nombre="whatsapp" />
              Escribir como {{ a.nombre.toLowerCase() }}
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</section>
