<section id="fabrica" class="fabrica" aria-labelledby="fabrica-titulo">
  <div class="shell">
    <header class="fabrica__cabeza">
      <div>
        <app-capitulo [num]="f.num" [nombre]="f.nombre" appRevelar />
        <h2 id="fabrica-titulo" class="titular" appRevelar [retraso]="80">
          <app-renglones [renglones]="f.titulo" />
        </h2>
      </div>
      <p class="fabrica__entrada lead" appRevelar [retraso]="240">{{ f.entrada }}</p>
    </header>

    <div class="fabrica__cuerpo">
      <figure class="fabrica__foto" appParallax appRevelar>
        <img [src]="f.imagen" [alt]="f.alt" width="1536" height="1024" loading="lazy" decoding="async" />
      </figure>

      <ol class="fabrica__pilares">
        @for (p of f.pilares; track p.titulo; let i = $index) {
          <li class="pilar" appRevelar [retraso]="i * 120">
            <span class="pilar__num mono">0{{ i + 1 }}</span>
            <div>
              <h3 class="pilar__titulo">{{ p.titulo }}</h3>
              <p class="pilar__texto">{{ p.texto }}</p>
            </div>
          </li>
        }
      </ol>
    </div>

    <dl class="fabrica__cifras">
      @for (c of f.cifras; track c.titulo; let i = $index) {
        <div class="cifra" appRevelar [retraso]="i * 140">
          <dt class="cifra__titulo">{{ c.titulo }}</dt>
          <dd class="cifra__valor" [appContador]="c.valor">{{ c.valor }}</dd>
          <dd class="cifra__detalle">{{ c.detalle }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
