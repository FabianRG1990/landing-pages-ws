<section id="contacto" class="contacto" aria-labelledby="contacto-titulo">
  <div class="shell">
  <!-- Panel con el matiz del logo: azul muy claro que vira a rosado -->
  <div class="contacto__panel">
    <header class="contacto__cabeza">
      <app-capitulo [num]="k.num" [nombre]="k.nombre" appRevelar />
      <h2 id="contacto-titulo" class="titular" appRevelar [retraso]="80">
        <app-renglones [renglones]="k.titulo" />
      </h2>
      <p class="lead" appRevelar [retraso]="220">{{ k.entrada }}</p>
    </header>

    <div class="tarjeta carta" appRevelar [retraso]="160">
      <!-- Radios nativos con forma de chip: flechas, Tab y lector de
           pantalla funcionan sin una sola línea de JS. -->
      <fieldset class="tarjeta__canales">
        <legend class="mono mono--ink">{{ k.pregunta }}</legend>
        <div class="chips">
          @for (c of canales; track c.id) {
            <label class="chip">
              <input type="radio" name="canal" [value]="c.nombre" (change)="canal.set(c.nombre)" />
              <span>{{ c.nombre }}</span>
            </label>
          }
        </div>
      </fieldset>

      <a class="btn btn--rojo tarjeta__cta" [href]="whatsapp()" target="_blank" rel="noopener">
        <app-icono nombre="whatsapp" />
        {{ k.cta }}
      </a>
      <a class="btn btn--linea tarjeta__visita" [href]="visita" target="_blank" rel="noopener">{{ k.visita }}</a>

      <dl class="tarjeta__datos">
        <div>
          <dt class="mono">WhatsApp</dt>
          <dd><a class="enlace" [href]="whatsapp()" target="_blank" rel="noopener">{{ site.whatsappVisible }}</a></dd>
        </div>
        <div>
          <dt class="mono">Teléfono</dt>
          <dd><a class="enlace" [href]="site.telefonoHref">{{ site.telefono }}</a></dd>
        </div>
        <div>
          <dt class="mono">Correo</dt>
          <dd><a class="enlace" [href]="'mailto:' + site.correo">{{ site.correo }}</a></dd>
        </div>
        <div>
          <dt class="mono">Planta</dt>
          <dd>{{ site.planta }}</dd>
        </div>
      </dl>
    </div>
  </div>
  </div>
</section>
