<section #seccion id="proceso" class="proceso" aria-labelledby="proceso-titulo">
  <div class="proceso__trama" aria-hidden="true"></div>

  <div class="shell">
    <header class="proceso__cabeza">
      <app-capitulo [num]="p.num" [nombre]="p.nombre" appRevelar />
      <h2 id="proceso-titulo" class="titular" appRevelar [retraso]="80">
        <app-renglones [renglones]="p.titulo" />
      </h2>
    </header>

    <div #pista class="proceso__pista">
      <!-- La línea se dibuja con el scroll y el camión la recorre: de la
           reunión a la entrega. Decorativa; el orden ya lo da la lista. -->
      <div class="proceso__linea" aria-hidden="true">
        <div class="proceso__progreso"></div>
        <span class="proceso__camion"><app-icono nombre="camion" /></span>
      </div>

      <ol class="proceso__pasos">
        @for (paso of p.pasos; track paso.n; let i = $index) {
          <li class="paso" appRevelar [retraso]="i * 140">
            <span class="paso__nodo" aria-hidden="true"></span>
            <span class="paso__num mono">{{ paso.n }}</span>
            <h3 class="paso__titulo">{{ paso.titulo }}</h3>
            <p class="paso__texto">{{ paso.texto }}</p>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
