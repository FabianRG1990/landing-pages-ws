<div #cinta class="cinta" aria-hidden="true">
  <div class="cinta__banda cinta__banda--azul">
    <div #azul class="cinta__pista">
      @for (v of vueltas; track v) {
        @for (n of lineas; track n) {
          <span class="cinta__item">{{ n }}</span>
        }
      }
    </div>
  </div>

  <div class="cinta__banda cinta__banda--roja">
    <div #roja class="cinta__pista">
      @for (v of vueltas; track v) {
        @for (n of canales; track n) {
          <span class="cinta__item">{{ n }}</span>
        }
      }
    </div>
  </div>
</div>
