<section #seccion class="firma" aria-label="Moofy, la marca">
  <div class="shell">
    <div #panel class="firma__panel bloque-azul">
      <div class="firma__trama" aria-hidden="true"></div>
      <div class="firma__luz" aria-hidden="true"></div>

      <div #logo class="firma__logo">
        <app-logo alt="Moofy" [diferido]="true" />
      </div>

      <p class="firma__lema" appRevelar>{{ p.lema }}</p>

      <div class="firma__portafolio" appRevelar [retraso]="160">
        <p class="mono">{{ p.etiqueta }}</p>
        <ul>
          @for (m of p.marcas; track m) {
            <li>{{ m }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
