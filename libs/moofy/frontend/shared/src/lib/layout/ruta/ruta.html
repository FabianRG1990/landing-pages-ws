<div #ruta class="ruta" aria-hidden="true">
  <!-- La carretera: una línea punteada de mapa que baja por toda la
       página. Se dibuja una vez (ruta.ts) y se desplaza con el contenido. -->
  <svg #mapa class="ruta__mapa" focusable="false">
    <path #filete class="ruta__filete" />
    <path #via class="ruta__via" />
    <circle #origen class="ruta__origen" r="4" />
    <g #destino class="ruta__destino">
      <path d="M0 0c-5.2-6.4-7.8-10.4-7.8-13.9a7.8 7.8 0 0 1 15.6 0C7.8-10.4 5.2-6.4 0 0z" />
      <circle cy="-13.9" r="2.7" />
    </g>
  </svg>

  <!-- Lo ya recorrido, en trazo firme. Es el mismo trazado dentro de una
       caja que crece hasta donde va el camión: como la carretera siempre
       baja, «lo recorrido» es todo lo que queda por encima de él. -->
  <div #hechaCaja class="ruta__hecha">
    <svg #mapaHecho focusable="false">
      <path #hechaFilete class="ruta__filete" />
      <path #hecha class="ruta__firme" />
    </svg>
  </div>

  <!-- El camión, visto desde arriba, fijo en pantalla: es la página la
       que pasa por debajo. La caja de fuera lo coloca y la de dentro lo
       orienta según la curva. -->
  <div #camion class="ruta__camion">
    <div #rumbo class="ruta__rumbo">
      <svg viewBox="0 0 24 52" focusable="false">
        <!-- Troquel: el mismo camión en blanco y más ancho, para que se
             despegue de una foto o del azul como el logo en el pie -->
        <g class="camion__troquel">
          <rect x="2" y="2" width="20" height="31" rx="2.6" />
          <rect x="3" y="34.5" width="18" height="15.5" rx="4.2" />
          <rect x="0.4" y="38.4" width="23.2" height="3" rx="1" />
        </g>

        <!-- Retrovisores -->
        <rect class="camion__espejo" x="0.4" y="38.4" width="3.4" height="3" rx="1" />
        <rect class="camion__espejo" x="20.2" y="38.4" width="3.4" height="3" rx="1" />

        <!-- La caja de carga: blanca, con la franja y el punto rojos -->
        <rect class="camion__caja" x="2" y="2" width="20" height="31" rx="2.6" />
        <path class="camion__franja" d="M5 7.2h14" />
        <circle class="camion__marca" cx="12" cy="18.5" r="3.4" />
        <path class="camion__nervio" d="M5 28.4h14" />

        <!-- La cabina, con el parabrisas hacia delante -->
        <rect class="camion__cabina" x="3" y="34.5" width="18" height="15.5" rx="4.2" />
        <path class="camion__vidrio" d="M5.6 43.2h12.8l-1.3 3.6a2 2 0 0 1-1.9 1.3H8.8a2 2 0 0 1-1.9-1.3z" />
        <path class="camion__techo" d="M6.2 37.6h11.6" />
      </svg>
    </div>
  </div>

  <!-- Lo que dice el camión al cruzar de una sección a otra -->
  <p #rotulo class="ruta__rotulo"><span #texto></span></p>
</div>
