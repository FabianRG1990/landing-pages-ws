<header id="nav" [class.scrolled]="scrolled()">
  <div class="nav-inner">
    <a class="brand" routerLink="/inicio" aria-label="Rosa Café — inicio">
      <span class="brand-logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
          <path d="M6 2v2M10 2v2M14 2v2" />
        </svg>
      </span>
      <span><span class="brand-name">ROSA</span><span class="brand-sub">café</span></span>
    </a>

    <nav class="nav-links">
      @for (item of items; track item.id) {
        <a [routerLink]="'/' + item.id" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>

    <a class="btn btn-primary btn-sm nav-cta" routerLink="/reservar">Reservar Mesa</a>

    <button
      class="nav-burger"
      [class.open]="menuOpen()"
      type="button"
      aria-label="Menú"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div id="mobile-menu" [class.open]="menuOpen()">
  <nav>
    @for (item of items; track item.id) {
      <a class="menu-link" [routerLink]="'/' + item.id" (click)="closeMenu()">
        <span class="mnum">{{ item.num }}</span>{{ item.label }}
      </a>
    }
    <a class="btn btn-primary menu-cta" routerLink="/reservar" (click)="closeMenu()">
      Reservar Mesa
    </a>
  </nav>
</div>
