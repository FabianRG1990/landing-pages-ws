<header class="nav" [class.scrolled]="scrolled()">
  <a class="brand" routerLink="/inicio">
    <img src="assets/logo-mark.png" alt="Sanar desde el corazón · Mónica Arias" />
    <span class="brand-txt">
      <span class="b1">Mónica Arias</span>
      <span class="b2">Sanar desde el corazón</span>
    </span>
  </a>
  <nav>
    <ul class="nav-links">
      @for (item of items; track item.id) {
        <li>
          <a [routerLink]="'/' + item.id" routerLinkActive="active">
            {{ item.label }}<span class="dot"></span>
          </a>
        </li>
      }
    </ul>
  </nav>
  <div class="nav-cta">
    <a class="btn btn-primary" routerLink="/contacto">Agendar cita</a>
    <button class="nav-burger" aria-label="Menú" (click)="toggleMenu()">
      <span></span><span></span>
    </button>
  </div>
</header>

<div class="mobile-menu">
  @for (item of items; track item.id) {
    <a [routerLink]="'/' + item.id" (click)="closeMenu()">
      <span class="mnum">{{ item.num }}</span> {{ item.label }}
    </a>
  }
</div>
