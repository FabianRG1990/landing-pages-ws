<div class="tw-panel" [hidden]="!visible()">
  <div class="tw-head">
    <span class="tw-title">Tweaks</span>
    <button class="tw-close" aria-label="Cerrar" (click)="dismiss()">&times;</button>
  </div>
  <div class="tw-body">
    <div class="tw-sec">Tipografía de títulos</div>
    <div class="tw-radio">
      @for (f of fonts; track f.key) {
        <button
          class="tw-opt"
          [class.on]="tipo() === f.key"
          [style.font-family]="f.display"
          (click)="setTipo(f.key)"
        >
          {{ f.label }}
        </button>
      }
    </div>
    <div class="tw-sec">Acento de color</div>
    <div class="tw-swatches">
      @for (a of accents; track a.key) {
        <button
          class="tw-sw"
          [class.on]="acento() === a.key"
          [title]="a.label"
          (click)="setAcento(a.key)"
        >
          <span [style.background]="a.wine"></span>{{ a.label }}
        </button>
      }
    </div>
  </div>
</div>
