name: Deploy bolleria preview to Firebase Hosting on PR

# Por cada Pull Request, builda la app `bolleria` y la sube a un canal de
# preview de su sitio dedicado. La URL del preview queda comentada
# automáticamente en el PR.
#
# No corre para PRs desde forks (no tendrían acceso al secret).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build production
        run: yarn nx build bolleria --configuration=production

      - name: Deploy preview to Firebase Hosting
        id: deploy_preview
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_PAGES_79AFC }}
        run: |
          set -euo pipefail

          gac_file="$(mktemp)"
          deploy_output="$(mktemp)"
          channels_output="$(mktemp)"
          trap 'rm -f "$gac_file" "$deploy_output" "$channels_output"' EXIT

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$gac_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$gac_file"

          branch_name="${{ github.event.pull_request.head.ref }}"
          branch_name="${branch_name:0:20}"
          sanitized_branch_name="$(printf '%s' "$branch_name" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
          sanitized_branch_name="${sanitized_branch_name:-preview}"
          channel_id="pr${{ github.event.number }}-${sanitized_branch_name}"

          set +e
          npx firebase-tools@latest hosting:channel:deploy "$channel_id" \
            --project landing-pages-79afc \
            --only bolleria \
            --expires 7d \
            --json >"$deploy_output" 2>&1
          status=$?
          set -e

          cat "$deploy_output"

          if [ "$status" -ne 0 ] \
            && ! grep -Fq 'is the current active version' "$deploy_output" \
            && ! grep -Fq 'already exists' "$deploy_output" \
            && ! grep -Fq 'HTTP Error: 409' "$deploy_output"; then
            exit "$status"
          fi

          npx firebase-tools@latest hosting:channel:list \
            --project landing-pages-79afc \
            --site bolleria \
            --json >"$channels_output"

          python - "$channel_id" "$channels_output" <<'PY'
          import json
          import os
          import sys

          channel_id = sys.argv[1]
          channels_path = sys.argv[2]

          with open(channels_path, encoding="utf-8") as fh:
              payload = json.load(fh)

          channels = payload["result"]["channels"]
          channel = next(
              (item for item in channels if item["name"].rsplit("/", 1)[-1] == channel_id),
              None,
          )

          if channel is None:
              raise SystemExit(f"Channel {channel_id!r} was not found after deploy")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"details_url={channel['url']}\n")
              fh.write(f"expire_time={channel.get('expireTime', '')}\n")
          PY

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DETAILS_URL: ${{ steps.deploy_preview.outputs.details_url }}
          EXPIRE_TIME: ${{ steps.deploy_preview.outputs.expire_time }}
        with:
          script: |
            const marker = '<!-- firebase-hosting-bolleria-preview -->';
            const body = `${marker}
            🔥 Preview for \`bolleria\` is ready.

            URL: ${process.env.DETAILS_URL}
            Expires: ${process.env.EXPIRE_TIME || '7d'}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
