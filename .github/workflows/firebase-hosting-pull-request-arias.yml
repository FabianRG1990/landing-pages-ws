name: Deploy arias preview to Firebase Hosting on PR

# Por cada Pull Request, builda la app `arias` y la sube a un canal de
# preview de su sitio dedicado. La URL del preview queda comentada
# automáticamente en el PR.
#
# No corre para PRs desde forks (no tendrían acceso al secret).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build production
        run: yarn nx build arias --configuration=production

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_PAGES_79AFC }}
          projectId: landing-pages-79afc
          target: arias
          expires: 7d
