name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Activate Yarn 4 (declared in package.json `packageManager`) BEFORE any
      # `yarn` command runs. Doing this first avoids the global Yarn 1.x being
      # used during cache resolution / start-ci-run, which fails against the
      # `yarn@4.x` pin. (Note: `cache: 'yarn'` is intentionally NOT set on
      # setup-node — it would invoke Yarn before Corepack is enabled.)
      - run: corepack enable
      - run: corepack prepare yarn@4.14.1 --activate

      - run: yarn install --immutable
      - run: yarn playwright install --only-shell

      # Tareas afectadas/relevantes. Sin Nx Cloud: corren localmente en el runner
      # con caché local (no distribuida). Se quitaron `start-ci-run`, `nx record`
      # y `fix-ci` porque requieren un workspace conectado a Nx Cloud.
      - run: yarn nx run-many -t lint test build typecheck e2e
