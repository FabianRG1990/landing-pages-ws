name: Deploy arias to Firebase Hosting on merge

# Cuando se mergea a `main`, builda la app `arias` y la publica al canal
# `live` de su sitio dedicado:
#   https://dra-monica-arias.web.app

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build production
        run: yarn nx build arias --configuration=production

      - name: Deploy to Firebase Hosting (live channel)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_PAGES_79AFC }}
        run: |
          set -euo pipefail

          service_account_file="$(mktemp)"
          deploy_output="$(mktemp)"
          trap 'rm -f "$service_account_file" "$deploy_output"' EXIT

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"

          set +e
          npx firebase-tools@latest hosting:channel:deploy live \
            --project landing-pages-79afc \
            --only arias \
            --json >"$deploy_output" 2>&1
          status=$?
          set -e

          cat "$deploy_output"

          if [ "$status" -ne 0 ] && ! grep -Eq 'FAILED_PRECONDITION|is the current active version' "$deploy_output"; then
            exit "$status"
          fi
