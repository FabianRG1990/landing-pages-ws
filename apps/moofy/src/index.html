    <!-- El estado inicial de las animaciones de entrada tiene que existir
         ANTES del primer pintado; si lo pone Angular al hidratar, el hero
         se ve completo, desaparece y vuelve a entrar. Si la app no arranca
         en 4 s, la clase se retira y todo el contenido queda visible. -->
    <script>
      (function () {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var html = document.documentElement;
        html.classList.add('con-movimiento');
        setTimeout(function () {
          if (!html.classList.contains('movimiento-listo')) html.classList.remove('con-movimiento');
        }, 4000);
      })();
    </script>

    <!-- Instrument Sans con cursiva real (el énfasis de los titulares) y
         el eje de anchura; Geist Mono para el metadato técnico. -->
