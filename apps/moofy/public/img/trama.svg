    <path d="M32 44c-6-2-9-7-9-12 6 1 9 6 9 12z"/>
    <path d="M32 44c6-2 9-7 9-12-6 1-9 6-9 12z"/>
  </g>
  <!-- Croissant -->
  <g transform="translate(204 26) rotate(8 36 32)">
