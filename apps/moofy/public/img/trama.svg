<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none" stroke="#0055a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- Doce piezas de panadería en cuatro filas al tresbolillo, con el
