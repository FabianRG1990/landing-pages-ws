    <path transform="translate(240 360)" d="M0-6c.900 3.900 2.100 5.100 6 6-3.900.900-5.100 2.100-6 6-.900-3.900-2.100-5.100-6-6 3.900-.900 5.100-2.100 6-6z" stroke="#d00020"/>
